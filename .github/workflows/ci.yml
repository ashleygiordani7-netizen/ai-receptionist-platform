name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # @platform/database's migration tests are real integration tests (see
    # packages/database/src/migrate.integration.test.ts) — they run
    # `drizzle-kit migrate` against a real, disposable Postgres and assert
    # the schema_migrations table actually exists, rather than mocking the
    # database. This service container is what makes DATABASE_URL resolve
    # to a real instance in CI; those tests skip themselves locally when
    # DATABASE_URL isn't set.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platform_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/platform_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No explicit `version:` here — pnpm/action-setup@v4 reads it from
      # package.json's `packageManager` field (pinned to an exact version,
      # pnpm@9.0.0), which is the single source of truth. Specifying it in
      # both places causes pnpm/action-setup to fail with
      # ERR_PNPM_BAD_PM_VERSION when they don't match exactly.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
