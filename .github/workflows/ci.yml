name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No explicit `version:` here — pnpm/action-setup@v4 reads it from
      # package.json's `packageManager` field (pinned to an exact version,
      # pnpm@9.0.0), which is the single source of truth. Specifying it in
      # both places causes pnpm/action-setup to fail with
      # ERR_PNPM_BAD_PM_VERSION when they don't match exactly.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
